# docs/nginx-planner.conf
# Regras do Gerador de Planner para servidores com nginx + PHP-FPM (sem Apache).
# Nesses servidores os arquivos .htaccess do projeto são IGNORADOS: a proteção das pastas
# internas precisa estar na configuração do nginx.
#
# No servidor do CECAPE, acrescentar ao fim de
#   /home/cecape/conf/web/sist.cecapescs.com.br/nginx.ssl.conf_cecape
# e depois testar e recarregar:  sudo nginx -t && sudo systemctl reload nginx
#
# Use UMA das duas opções.

# ===== Opção A: só a prévia de compartilhamento fica pública =====
# O planner continua acessível apenas pela rede interna; redes sociais conseguem ler
# o título, a descrição e a imagem do link.
#
# location = /planner { allow all; return 301 /planner/; }
# location = /planner/ { allow all; try_files /planner/index.html =404; }
# location = /planner/assets/img/compartilhar.jpg { allow all; }

# ===== Opção B: planner liberado para a internet =====
# Crie o administrador em /planner/instalar.php ANTES de aplicar: enquanto não houver
# usuário cadastrado, essa página aceita o primeiro cadastro de quem a abrir.
#
# --- Planner: pastas internas bloqueadas ---
location ^~ /planner/app/ { return 404; }
location ^~ /planner/sql/ { return 404; }
location ^~ /planner/logs/ { return 404; }
location ^~ /planner/docs/ { return 404; }
# --- Planner: liberado para a internet ---
location = /planner { allow all; return 301 /planner/; }
location /planner/ {
    allow all;
    location ~ /\. { return 404; }
    include /home/cecape/conf/web/sist.cecapescs.com.br/cecape-php.inc;
}
