# docs/nginx-planner.conf
# Regras do Gerador de Planner para servidores com nginx + PHP-FPM (sem Apache).
# Nesses servidores os arquivos .htaccess do projeto são IGNORADOS: a proteção das pastas
# internas precisa estar na configuração do nginx.
#
# No servidor do CECAPE, as regras ficam em
#   /home/cecape/conf/web/sist.cecapescs.com.br/nginx.ssl.conf_cecape
# Depois de alterar, testar e recarregar:  sudo nginx -t && sudo systemctl reload nginx
#
# O acesso ao planner é controlado pelo próprio sistema (index.php): quem não entrou com uma
# conta autorizada vê só a tela de entrada. Por isso a pasta fica liberada para a internet,
# e o nginx cuida apenas de esconder o que nunca deve ser servido.

# --- Planner: pastas internas bloqueadas ---
location ^~ /planner/app/ { return 404; }     # código, configuração e o modelo do gerador
location ^~ /planner/sql/ { return 404; }
location ^~ /planner/logs/ { return 404; }
location ^~ /planner/docs/ { return 404; }
# Versões anteriores tinham um index.html aberto. Se ele sobrar na pasta, não pode ser servido.
location = /planner/index.html { return 404; }

# --- Planner: liberado para a internet (o login é feito pelo sistema) ---
location = /planner { allow all; return 301 /planner/; }
location /planner/ {
    allow all;
    index index.php;
    location ~ /\. { return 404; }
    include /home/cecape/conf/web/sist.cecapescs.com.br/cecape-php.inc;
}
